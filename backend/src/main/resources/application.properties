# Nombre de la aplicación
spring.application.name=examenes-taekwondo

# Puerto del servidor
server.port=8080

# ===========================================
# BASE DE DATOS - PostgreSQL
# ===========================================
# En desarrollo: `docker compose up -d` en la raíz del repo levanta una base
# de datos con estos valores por defecto. En producción se definen
# DB_URL, DB_USERNAME y DB_PASSWORD en el entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taekwondo}
spring.datasource.username=${DB_USERNAME:taekwondo}
spring.datasource.password=${DB_PASSWORD:taekwondo}

# El esquema lo crean y evolucionan las migraciones de Flyway
# (src/main/resources/db/migration). Hibernate solo comprueba que las
# entidades coinciden con las tablas y no toca nada.
spring.flyway.locations=classpath:db/migration

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=validate
# Las entidades se convierten a DTO dentro de los servicios: no hace falta
# mantener la sesión de Hibernate abierta durante la vista.
spring.jpa.open-in-view=false
# Poner SHOW_SQL=true para ver las consultas en consola
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# CORS
# ========================================
# Orígenes permitidos separados por comas (en producción, el dominio del frontend)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ========================================
# JWT (JSON Web Token)
# ========================================
# La clave se lee de la variable de entorno JWT_SECRET. Si no existe,
# se usa el default (SOLO PARA DESARROLLO). En producción se arranca con
# SPRING_PROFILES_ACTIVE=prod y la aplicación no arranca sin un JWT_SECRET
# propio de 32 bytes o más ni con la ADMIN_PASSWORD de desarrollo (RNF-02):
#   export JWT_SECRET="$(openssl rand -base64 48)"
#
# HS256 requiere claves de al menos 256 bits (32 caracteres ASCII).
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-replace-in-production-min-32-chars-long}

# Expiración del token en milisegundos. Default: 8 horas, una jornada (DE-10);
# además el navegador no guarda la sesión al cerrarse.
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ========================================
# LOGGING
# ========================================
logging.level.com.taekwondo.examenes=INFO

# Mensajes de validación siempre en español, pida lo que pida el navegador (RNF-13)
spring.web.locale=es
spring.web.locale-resolver=fixed
# Un número o una casilla que no llega en el JSON vale 0 o «no», en vez de 400 «JSON malformado» sin decir qué falta;
# si el valor importa, la validación lo rechaza con su mensaje (p. ej. «Número de preguntas»)
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Correo para recuperar la cuenta (RF-34). En desarrollo, Mailpit en Docker (http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@taekwondo.local}
# Dirección pública del frontend, para el enlace del correo
app.public-url=${APP_PUBLIC_URL:http://localhost:4200}

# Límite de intentos (RNF-07). Inicio de sesión: solo cuentan los fallos, por dirección y minuto, y por
# cuenta (al 5.º fallo seguido espera 30 s); los correctos no cuentan
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login-failures-per-minute=50
app.rate-limit.login-account-failures=5
app.rate-limit.login-account-wait-seconds=30
# Por dirección y minuto. Registro: un profesor puede dar de alta a su clase desde el gimnasio
app.rate-limit.register-per-minute=30
app.rate-limit.recovery-per-minute=5
# Altos: un aula entera entrega por la misma dirección de su router
app.rate-limit.submit-per-minute=300
# Portada del examen y empezar o recuperar un intento (DE-25): frena recorrer códigos y crear intentos sin fin
app.rate-limit.exam-page-per-minute=300
app.rate-limit.attempt-start-per-minute=300
# Una petición por pregunta contestada: 100 alumnos con 30 preguntas en un minuto
app.rate-limit.answers-per-minute=3000
