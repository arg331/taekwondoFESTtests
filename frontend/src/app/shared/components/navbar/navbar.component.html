<mat-toolbar class="navbar">

  <a routerLink="/dashboard" class="brand">
    <span class="brand-icon">🥋</span>
    <span class="brand-name">FEST Taekwondo</span>
  </a>

  <span class="spacer"></span>

  <nav class="nav-links">
    @for (link of navLinks(); track link.path) {
      <a mat-button
         [routerLink]="link.path"
         routerLinkActive="active-link">
        <mat-icon>{{ link.icon }}</mat-icon>
        {{ link.label }}
      </a>
    }
  </nav>

  <span class="spacer"></span>

  <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
    <mat-icon>account_circle</mat-icon>
    <span class="username">{{ auth.currentUser()?.displayName }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="user-info-menu">
      <p class="user-name">{{ auth.currentUser()?.displayName }}</p>
      <p class="user-email">{{ auth.currentUser()?.email }}</p>
      <p class="user-role">{{ auth.currentUser()?.role }}</p>
    </div>
    <mat-divider />
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      Cerrar sesión
    </button>
  </mat-menu>

</mat-toolbar>
