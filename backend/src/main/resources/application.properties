# Nombre de la aplicación
spring.application.name=examenes-taekwondo

# Puerto del servidor
server.port=8080

# ===========================================
# BASE DE DATOS - H2 (Desarrollo)
# ===========================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 (para ver la BD en el navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# JWT (JSON Web Token)
# ========================================
# La clave se lee de la variable de entorno JWT_SECRET. Si no existe,
# se usa el default (SOLO PARA DESARROLLO). En producción se DEBE
# exportar JWT_SECRET antes de arrancar:
#   export JWT_SECRET="$(openssl rand -base64 48)"
#
# HS256 requiere claves de al menos 256 bits (32 caracteres ASCII).
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-replace-in-production-min-32-chars-long}

# Expiración del token en milisegundos. Default: 7 días.
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ========================================
# LOGGING
# ========================================
logging.level.org.springframework.web=DEBUG
logging.level.com.taekwondo.examenes=DEBUG
